name: cleona
description: "Cleona Chat - Decentralized P2P Messenger with Post-Quantum Encryption"
publish_to: 'none'
version: 4.2.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # The new delivery layer. FIRST STEP OF THE REPLACEMENT (S384) — from
  # here on it is visible to the app; nobody imports it yet
  # (`grep -rln "package:myzel" lib/` = 0), so nothing changes in
  # behaviour yet.
  #
  # THE CYCLE IS INTENTIONAL AND IT HOLDS: `mycelium` in turn depends on
  # `cleona` (crypto, file encryption, Reed-Solomon — 8 files,
  # none of it delivery layer). Measured on 14.09.2026, first on two
  # throwaway packages and then here: `flutter pub get` resolves, and a
  # probe file in `lib/` that really uses `Dienst` and `Zustand`
  # analyses cleanly.
  #
  # Why not pull the foundations into a third package: that would have given
  # **296 files** in `lib/`, `bin/` and `test/` new import paths
  # (measured). And why mycelium does not simply move to
  # `lib/core/mycelium/`: then the package boundary disappears, which today
  # ENFORCES that the new layer does not touch the old one — a
  # gate would become an intention.
  mycelium:
    path: mycelium

  cupertino_icons: ^1.0.8

  # Protobuf
  protobuf: ^4.0.0
  fixnum: ^1.1.0

  # FFI for native crypto/erasure libs
  ffi: ^2.1.0

  # Provider for state management
  provider: ^6.1.0

  # UUID generation
  uuid: ^4.0.0

  # Path utilities
  path: ^1.9.0
  path_provider: ^2.1.0

  # Connectivity detection
  connectivity_plus: ^6.0.0

  # QR Code
  qr: ^3.0.2
  qr_flutter: ^4.1.0

  # Shared preferences for settings
  shared_preferences: ^2.2.0

  # Collection utilities
  collection: ^1.18.0

  # File picker for profile pictures
  file_picker: ^8.0.0

  # Camera capture for profile pictures (Android)
  image_picker: ^1.0.0

  # QR code scanning (Android camera)
  mobile_scanner: ^6.0.0
  pdf: ^3.11.2
  printing: ^5.14.3
  video_player: ^2.11.1
  just_audio: ^0.10.5
  record: ^6.2.0
  url_launcher: ^6.3.2
  desktop_drop: ^0.7.0
  share_plus: ^10.1.4

  # NFC Contact Exchange (Android only)
  nfc_manager: ^3.5.0
  emoji_picker_flutter: ^4.4.0

  # Image decoding/resizing (used for link preview thumbnail recompression)
  image: ^4.8.0

  # @visibleForTesting and other annotations (used in PerMessageKem v2 salt accessor).
  meta: ^1.15.0
  sqlite3: ^3.5.2

  # HMAC-SHA256 for log redaction (lib/core/log/log_redaction.dart).
  # Until 06.09.2026 it was only transitive in pubspec.lock; a direct import
  # of a transitive package is not a declared dependency. Pure Dart,
  # no FFI — the daemon stays flutter-free, and redaction also runs
  # before crypto initialisation.
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/app_icon.ico
    - assets/app_icon_beta.png
    - assets/app_icon_beta.ico
    - assets/tray_icon.png
    - assets/tray_icon_beta.png
    - assets/icons/skins/
    - assets/cleona_maintainer_public.pem
    - assets/sounds/
    # The three state images of the ONE connection indicator (§22.9,
    # owner decision E3 = A, S388): searching -> conn_weak,
    # connecting -> conn_medium, ready -> conn_good
    # (`readinessIconName` in lib/core/tray/tray_status.dart).
    # conn_strong and conn_skeleton were dropped with the five-level scale.
    - assets/conn_good.png
    - assets/conn_medium.png
    - assets/conn_weak.png
    # The same three images as ICO — the Windows notification area only accepts
    # an `.ico` resource via `Shell_NotifyIcon` (§22.9,
    # owner decision V-10-b, 09.09.2026). Generated from the PNGs next to them
    # with `dart run scripts/make_tray_icos.dart`; do not touch by hand.
    - assets/conn_good.ico
    - assets/conn_medium.ico
    - assets/conn_weak.ico
    - assets/nat_wizard/router_db.json
    - assets/skins/ocean/
    - assets/skins/sunset/
    - assets/skins/forest/
    - assets/skins/amethyst/
    - assets/skins/fire/
    - assets/skins/storm/
    - assets/skins/gold/

# ── Store: SQLite3 Multiple Ciphers from VENDORED source (S366) ─────────
#
# Not the prebuilt binary package from GitHub and NOT the
# system library. Both would be a step backwards here:
#
#   * System library: on this workbench SQLite 3.45.1 — below
#     3.53.2 and thus affected by CVE-2026-11822 / CVE-2026-11824,
#     two memory bugs in FTS5. §21.4 sets >= 3.53.3 normatively.
#   * Prebuilt binary package: we do not co-determine the compile switches,
#     and two of them are guarantees of the architecture —
#     SQLITE_TEMP_STORE=3 (no plaintext temp on disk, §4.5.3) and
#     SQLITE_SECURE_DELETE (deleted pages are overwritten,
#     §21.5). A switch set by a third party is no guarantee.
#
# The source lives under native/cleona_store/vendor/sqlite3mc/, origin
# and checksum in the header of native/cleona_store/CMakeLists.txt.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: native/cleona_store/vendor/sqlite3mc/sqlite3mc_amalgamation.c
      defines:
        defines:
          - SQLITE_ENABLE_FTS5
          - SQLITE_THREADSAFE=1
          - SQLITE_TEMP_STORE=3
          - SQLITE_SECURE_DELETE
          - SQLITE_DQS=0
          - SQLITE_DEFAULT_FOREIGN_KEYS=1
          - SQLITE_OMIT_DEPRECATED
