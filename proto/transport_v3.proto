// ── Identity resolution V3 (§4.3) ───────────────────────────────────────
//
// AuthManifestV3 extends AuthManifestProto (old) with the user pubkeys,
// so that the receiver can verify the sig WITHOUT a separate identity lookup.
// Spec: Appendix A.5 AuthManifest.
message AuthManifestV3 {
  bytes           user_id                 = 1;
  repeated bytes  authorized_device_ids   = 2;
  uint64          ttl_seconds             = 3;   // 86400 (24h)
  uint64          sequence_number         = 4;
  uint64          published_at_ms         = 5;
  bytes           ed25519_sig             = 6;
  bytes           ml_dsa_sig              = 7;
  bytes           user_ed25519_pk         = 8;   // for in-place verify
  bytes           user_ml_dsa_pk          = 9;
}
message LivenessRecordV3 {
  bytes                      user_id            = 1;
  bytes                      device_node_id     = 2;
  repeated PeerAddressProto  addresses          = 3;
  uint64                     ttl_seconds        = 4;   // 900 (15min) or 3600 (1h)
  uint64                     sequence_number    = 5;
  uint64                     published_at_ms    = 6;
  bytes                      ed25519_sig        = 7;   // signed by USER key (not device)
  bytes                      device_ed25519_pk  = 8;   // for outer-sig verify at the receiver
}
// ── DeviceKemRecord V3 (2D-DHT, wave 5, §4.3) ───────────────────────────
//
// Third 2D-DHT record next to AuthManifestV3 and LivenessRecordV3. Carries
// the device KEM pubkeys (X25519 + ML-KEM-768) that were needed for the KEM encap on
// InfrastructureFrameV3 (and later ONION_LAYER).
// S368: `InfrastructureFrameV3` no longer exists (see above). This
// sentence stays as a statement of origin — it explains WHAT the record
// was once built for, and is no statement about what runs today.
//
// Lifecycle separation: KEM PK changes only on device key reset (multi-
// year cadence), liveness flips every 15min. Separate records avoid
// unnecessary DHT traffic from the joint republish.
//
// Trust anchor: signed by user master Ed25519 key (same chain as
// AuthManifestV3 — the user vouches for the device KEM PK of their
// authorised device).
//
// Storage key: SHA-256("kem" || user_id || device_id) — own key space,
// independent of "auth"+userId and "live"+userId+deviceId.
message DeviceKemRecordV3 {
  bytes  user_id              = 1;   // 32 bytes
  bytes  device_id            = 2;   // 32 bytes
  bytes  device_x25519_pk     = 3;   // 32 bytes
  bytes  device_ml_kem_pk     = 4;   // 1184 bytes (ML-KEM-768 public key)
  uint64 ttl_seconds          = 5;   // 86400 (24h)
  uint64 sequence_number      = 6;
  uint64 published_at_ms      = 7;
  bytes  ed25519_sig          = 8;   // signed by user master Ed25519 key
  bytes  user_ed25519_pk      = 9;   // for in-place verify
  // P5: see LivenessRecordProto — delegated signature of a linked
  // device. Empty = signed directly under the user key.
  // P6: the certificate is not sent along, the receiver takes it from
  // the AuthManifest (see LivenessRecordProto). Field 11 stays reserved.
  bytes  signer_ed25519_pk    = 10;
  reserved 11;
}
// ── PeerListEntry V3 (§5.x PEER_LIST_PUSH) ──────────────────────────────
//
// Replaces PeerInfoProto in the V3 PEER_LIST_* frames. Narrower because
// identity fields (pubkeys, user ID) now come from the 2D-DHT resolver.
message PeerListEntryV3 {
  bytes                       device_id        = 1;   // 32 bytes
  repeated PeerAddressProto   addresses        = 2;
  uint64                      last_seen_ms     = 3;
  uint64                      age_hours        = 4;   // routing-table-age hint
  ConnectionTypeProto         connection_type  = 5;
}
// ── RelayForward V3 ─────────────────────────────────────────────────────
//
// Close in content to RelayForward (old), but:
//   - wrappedPacket = NetworkPacketV3 (instead of MessageEnvelope)
//   - origin_device_id replaces origin_node_id (terminology hygiene)
//   - no more origin_user_id (user identity sits in the inner frame)
message RelayForwardV3 {
  bytes           relay_id            = 1;   // 16 bytes UUID — Anti-Loop
  bytes           final_recipient_id  = 2;   // = device_id of final destination
  bytes           wrapped_packet      = 3;   // serialized NetworkPacketV3
  uint32          hop_count           = 4;
  uint32          max_hops            = 5;   // = 3
  uint32          ttl                 = 6;
  bytes           origin_device_id    = 7;
  uint64          created_at_ms       = 8;
  repeated bytes  visited             = 9;   // device_ids that already forwarded
}
// ── Deferred Key Exchange (rev3, §8.1.1) ─────────────────────────────────

message DeviceKemRequestV3 {
  bytes   target_user_id    = 1;   // 32 bytes — userId of the device owner
  bytes   target_device_id  = 2;   // 32 bytes — specific device being queried
  bytes   nonce             = 3;   // 16 bytes — replay protection + OFFER binding
  uint64  timestamp_ms      = 4;
}
message DeviceKemOfferV3 {
  bytes   device_x25519_pk  = 1;   // 32 bytes
  bytes   device_ml_kem_pk  = 2;   // 1184 bytes (ML-KEM-768)
  bytes   nonce             = 3;   // echo of REQUEST nonce
  bytes   user_ed25519_sig  = 4;   // Ed25519 sig over (device_x25519_pk + device_ml_kem_pk + nonce)
  uint64  timestamp_ms      = 5;
}
// ── First-CR-Mailbox (rev3, §5.5b) ──────────────────────────────────────

message FirstCrStoreV3 {
  bytes   recipient_user_id   = 1;   // 32 bytes — target userId
  bytes   recipient_device_id = 2;   // 32 bytes — target deviceId
  bytes   encrypted_cr_blob   = 3;   // KEM-encrypted InfrastructureFrame (opaque to SeedPeer)
  bytes   sender_device_id    = 4;   // 32 bytes — for dedup
  uint64  timestamp_ms        = 5;
  uint64  ttl_ms              = 6;   // max 7 days (604800000)
}
message FirstCrStoreAckV3 {
  bool    accepted            = 1;
  string  reject_reason       = 2;   // "quota_exceeded" | "ttl_exceeded" | ...
  bytes   recipient_user_id   = 3;   // echo from FirstCrStoreV3 (V3.2 correlation)
}
message FirstCrDeliverV3 {
  bytes   encrypted_cr_blob   = 1;   // same blob from FIRST_CR_STORE
  bytes   sender_device_id    = 2;   // original sender
  uint64  stored_at_ms        = 3;   // when the SeedPeer received the STORE
}
