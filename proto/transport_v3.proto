  // §9.5.7 System-Channel record gossip — S368 RESERVED
  // The gossip ran over the BOOT path of the InfrastructureFrame, which no longer
  // exists on this line. The system channels themselves remain (§16.7);
  // reserved is their V3 distribution path. ZERO occurrences each.
  reserved 230, 231, 232, 233;
