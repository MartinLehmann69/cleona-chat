###############################################################################
# macos-integration-test.yml — macOS native integration test on GitHub Actions
#
# Phase 1: Startup smoke (always)
#   FFI dylib loading, app launch, setup flow, UI navigation
#
# Phase 2: Network integration (when BOOTSTRAP_CONTACT_SEED variable is set)
#   ContactSeed import, peer connection to bootstrap via relay cascade
#
# No signing needed — runs locally on the runner, not distributed.
###############################################################################
name: macOS Integration Test

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/build-macos-libs.sh'
      - 'macos/**'
      - 'lib/core/crypto/*_ffi.dart'
      - 'lib/core/contact/contact_seed.dart'
      - 'lib/core/platform/app_paths.dart'
      - 'integration_test/app_test_ci.dart'
      - '.github/workflows/macos-integration-test.yml'

concurrency:
  group: macos-integration-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  integration-test:
    name: macOS — Integration Test
    # macos-26, NOT macos-14. Since 9dfd369a (Flutter 3.41.2 -> 3.44.6) the
    # Swift Package Manager plugin resolution needs the newer Xcode. On
    # macos-14 Flutter falls back to the CocoaPods layout for
    # video_player_avfoundation and compiles `@import Flutter` — the iOS
    # module name — against a macOS target, which fails with
    # "module 'Flutter' not found". macos/ has no Podfile; this project is
    # SwiftPM-only on macOS. Every green macOS job runs on macos-26.
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: brew install cmake ninja autoconf automake libtool pkg-config

      - name: Cache native lib sources
        uses: actions/cache@v5
        with:
          path: /tmp/macos-libs-build-*
          key: macos-native-libs-${{ hashFiles('scripts/build-macos-libs.sh') }}
          # No restore-keys — see ios-build.yml for the full rationale. This
          # caches a *build tree*, not immutable downloads. A prefix fallback
          # serves autoconf state and config.cache from a different version of
          # the build script; aclocal then dies on m4/lt~obsolete.m4.

      - name: Build native dylibs
        run: ./scripts/build-macos-libs.sh --arch arm64
        timeout-minutes: 30

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --debug --dart-define=NETWORK_CHANNEL=beta

      - name: Place dylibs in app bundle
        run: |
          APP_PATH="build/macos/Build/Products/Debug/Cleona.app"
          FRAMEWORKS="$APP_PATH/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"
          for f in build/macos-libs/arm64/*.dylib; do
            cp "$f" "$FRAMEWORKS/"
            echo "Placed: $(basename $f)"
          done
          echo "=== Dylibs in Frameworks ==="
          ls -lh "$FRAMEWORKS"/*.dylib 2>/dev/null || echo "No dylibs found!"

      # DIAGNOSIS (S412, 05.11.2026 — measure before the fix, owner A). The
      # runs of 30.10. and 04.11. hung 43 min after "[main] KeyringService OK"
      # until the 50-min job limit; the cleanup killed an orphan `security`.
      # lib/core/crypto/keyring_service.dart _MacOsKeychainKeyring calls
      # `security` with Process.runSync and no bound, which blocks the whole
      # isolate — `--timeout 120s` never fired. Not yet measured: WHICH
      # `security` call waits and WHY (locked keychain? a prompt without a
      # screen?). This step records the keychain state before the test and,
      # if the test is still running after 8 min (green runs took 2:35–2:51
      # including the app build), the processes with their arguments (the
      # value after -w is a secret and is masked), the keychain state again
      # and the test output so far; then it stops the test and fails.
      # Every `security` call here is bounded by perl's alarm (macOS ships no
      # `timeout`). Remove this diagnosis with the fix of the keychain backend.
      - name: Run integration test (with hang diagnosis)
        env:
          BOOTSTRAP_CONTACT_SEED: ${{ vars.BOOTSTRAP_CONTACT_SEED }}
        run: |
          set +e
          bounded() { perl -e 'alarm shift; exec @ARGV' "$@"; echo "  (exit $?)"; }
          keychain_state() {
            echo "--- keychains (user): ---";   bounded 20 security list-keychains -d user
            echo "--- default keychain: ---";   bounded 20 security default-keychain -d user
            KC=$(bounded 20 security default-keychain -d user | head -1 | tr -d ' "')
            echo "--- show-keychain-info $KC: ---"; bounded 20 security show-keychain-info "$KC"
          }
          echo "=== DIAG before the test ==="
          keychain_state
          flutter test integration_test/app_test_ci.dart -d macos --timeout 120s > test-output.log 2>&1 &
          TEST_PID=$!
          WAITED=0
          while kill -0 "$TEST_PID" 2>/dev/null && [ "$WAITED" -lt 480 ]; do
            sleep 15; WAITED=$((WAITED + 15))
          done
          if kill -0 "$TEST_PID" 2>/dev/null; then
            echo "=== DIAG: test still running after ${WAITED}s — hang ==="
            echo "--- processes (security, Cleona, dart, SecurityAgent; -w value masked): ---"
            ps -axo pid,ppid,etime,stat,command \
              | grep -E '[s]ecurity|[C]leona|[d]art|[S]ecurityAgent|[s]ecurityd' \
              | sed -E 's/(-w )[^ ]+/\1<masked>/g'
            keychain_state
            echo "--- test output so far (last 60 lines): ---"
            tail -60 test-output.log
            pkill -P "$TEST_PID" 2>/dev/null; kill "$TEST_PID" 2>/dev/null
            echo "::error::integration test hung (> ${WAITED}s) — see DIAG above"
            exit 1
          fi
          wait "$TEST_PID"; EXIT_CODE=$?
          cat test-output.log
          exit $EXIT_CODE

      - name: Collect crash logs on failure
        if: failure()
        run: |
          echo "=== Crash Reports ==="
          find ~/Library/Logs/DiagnosticReports -name "Cleona*" -mmin -10 2>/dev/null | head -5 | while read f; do
            echo "--- $f ---"
            head -50 "$f"
          done
          echo "=== Test Output ==="
          tail -50 test-output.log 2>/dev/null || true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-test-failure-logs
          path: |
            test-output.log
            ~/Library/Logs/DiagnosticReports/Cleona*
          retention-days: 7
