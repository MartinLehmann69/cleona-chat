###############################################################################
# macos-integration-test.yml — macOS native integration test on GitHub Actions
#
# Phase 1: Startup smoke (always)
#   FFI dylib loading, app launch, setup flow, UI navigation
#
# No repository variable or secret is read here: a variable of a public
# repository stands in clear text in every public log that names it (S422).
#
# No signing needed — runs locally on the runner, not distributed.
###############################################################################
name: macOS Integration Test

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/build-macos-libs.sh'
      - 'macos/**'
      - 'lib/core/crypto/*_ffi.dart'
      - 'lib/core/contact/contact_seed.dart'
      - 'lib/core/platform/app_paths.dart'
      - 'integration_test/app_test_ci.dart'
      - 'integration_test/keychain_takeover_ci.dart'
      - 'lib/core/platform/keychain_ffi.dart'
      - 'lib/core/crypto/keyring_service.dart'
      - '.github/workflows/macos-integration-test.yml'

concurrency:
  group: macos-integration-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  integration-test:
    name: macOS — Integration Test
    # macos-26, NOT macos-14. Since 9dfd369a (Flutter 3.41.2 -> 3.44.6) the
    # Swift Package Manager plugin resolution needs the newer Xcode. On
    # macos-14 Flutter falls back to the CocoaPods layout for
    # video_player_avfoundation and compiles `@import Flutter` — the iOS
    # module name — against a macOS target, which fails with
    # "module 'Flutter' not found". macos/ has no Podfile; this project is
    # SwiftPM-only on macOS. Every green macOS job runs on macos-26.
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: brew install cmake ninja autoconf automake libtool pkg-config

      - name: Cache native lib sources
        uses: actions/cache@v5
        with:
          path: /tmp/macos-libs-build-*
          key: macos-native-libs-${{ hashFiles('scripts/build-macos-libs.sh') }}
          # No restore-keys — see ios-build.yml for the full rationale. This
          # caches a *build tree*, not immutable downloads. A prefix fallback
          # serves autoconf state and config.cache from a different version of
          # the build script; aclocal then dies on m4/lt~obsolete.m4.

      - name: Build native dylibs
        run: ./scripts/build-macos-libs.sh --arch arm64
        timeout-minutes: 30

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --debug --dart-define=NETWORK_CHANNEL=beta

      - name: Place dylibs in app bundle
        run: |
          APP_PATH="build/macos/Build/Products/Debug/Cleona.app"
          FRAMEWORKS="$APP_PATH/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"
          for f in build/macos-libs/arm64/*.dylib; do
            cp "$f" "$FRAMEWORKS/"
            echo "Placed: $(basename $f)"
          done
          echo "=== Dylibs in Frameworks ==="
          ls -lh "$FRAMEWORKS"/*.dylib 2>/dev/null || echo "No dylibs found!"

      # The hang diagnosis of S412 (04edf98e) is gone with its cause (S413,
      # D-95): the keychain is reached through Security.framework with the
      # dialog switched off, so a call that would need it answers -25308 at
      # once instead of waiting. The step bound stays as a net: a hang is
      # a finding, never 50 minutes of job time.
      #
      # Case 1 — fresh keychain: the setup writes the seed with the access
      # list "this program", reads it back WITHOUT a dialog, and the home
      # screen comes up.
      - name: Run integration test (fresh keychain)
        timeout-minutes: 10
        run: |
          set -o pipefail
          flutter test integration_test/app_test_ci.dart -d macos --timeout 120s 2>&1 | tee test-output.log

      # Case 2 — an entry of 4.2.3–4.2.6 (D-95): written by `security` with
      # `-T ''` (empty access list) into a keychain of its own, which is the
      # only one in the search list, so case 1's entries cannot answer. The
      # app must report "present, takeover needed" and must NOT generate a
      # new seed. Writing with `-T ''` raises no dialog (only reading does,
      # `SecAccess.h` `trustedlist`); every `security` call is still bounded.
      # The test value is a fixed CI dummy, not a secret.
      - name: Keychain takeover case (entry of 4.2.3–4.2.6)
        timeout-minutes: 10
        run: |
          set -eo pipefail
          bounded() {
            "$@" & local pid=$!
            ( sleep 20; kill "$pid" 2>/dev/null ) & local guard=$!
            wait "$pid"; local rc=$?
            kill "$guard" 2>/dev/null || true
            return $rc
          }
          KC="$HOME/Library/Keychains/ci-takeover.keychain-db"
          KCPW="ci_takeover_temp"
          OLD_LIST=$(security list-keychains -d user | tr -d '"')
          bounded security create-keychain -p "$KCPW" "$KC"
          bounded security set-keychain-settings "$KC"
          bounded security unlock-keychain -p "$KCPW" "$KC"
          bounded security list-keychains -d user -s "$KC"
          bounded security default-keychain -d user -s "$KC"
          DUMMY=$(printf 'ci-dummy-not-a-secret-0123456789' | base64)
          bounded security add-generic-password -a cleona -s cleona_master_seed -w "$DUMMY" -T '' "$KC"
          BEFORE=$(bounded security find-generic-password -a cleona -s cleona_master_seed "$KC" | grep -E '"mdat"')
          echo "entry before: $BEFORE"
          flutter test integration_test/keychain_takeover_ci.dart -d macos --timeout 120s 2>&1 | tee takeover-output.log
          AFTER=$(bounded security find-generic-password -a cleona -s cleona_master_seed "$KC" | grep -E '"mdat"')
          echo "entry after:  $AFTER"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::the 4.2.3–4.2.6 entry was rewritten — D-95 forbids it"
            exit 1
          fi
          # Restore the search list for later steps.
          bounded security list-keychains -d user -s $OLD_LIST

      - name: Collect crash logs on failure
        if: failure()
        run: |
          echo "=== Crash Reports ==="
          find ~/Library/Logs/DiagnosticReports -name "Cleona*" -mmin -10 2>/dev/null | head -5 | while read f; do
            echo "--- $f ---"
            head -50 "$f"
          done
          echo "=== Test Output ==="
          tail -50 test-output.log 2>/dev/null || true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-test-failure-logs
          path: |
            test-output.log
            takeover-output.log
            ~/Library/Logs/DiagnosticReports/Cleona*
          retention-days: 7
