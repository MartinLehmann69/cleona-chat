org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Gradle's default is parallel=false, so all 19 modules (:app plus 18 Android
# plugin modules from .flutter-plugins-dependencies) were built one after the
# other. Measured 2026-07-28, alternating A/B with plugin and app build dirs
# cleared before each run: 15 s / 18 s serial vs 9 s / 8 s parallel -- roughly
# 2x on the Gradle phase, all four runs rc=0 with a valid APK.
# org.gradle.workers.max is intentionally omitted; its default is already nproc.
#
# Parallel-safety checked: android/build.gradle.kts uses allprojects/subprojects
# blocks and evaluationDependsOn(":app"), which is cross-project CONFIGURATION
# from the root script -- permitted under --parallel, since configuration runs
# single-threaded either way. What --parallel forbids is reaching into another
# project's model at EXECUTION time, which does not happen here.
# Caveat worth remembering: missing task dependencies are masked by serial
# execution and surface under parallel. If APK builds ever turn flaky, this is
# the first thing to suspect.
org.gradle.parallel=true
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
